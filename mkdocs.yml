site_name: ""
site_description: Enterprise Test Automation Framework Documentation
site_author: QA Engineering Team
site_url: https://vinipx.github.io/taflex

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - header.autohide
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/taflex
    - icon: fontawesome/brands/slack
      link: https://your-org.slack.com/archives/taflex
  version:
    provider: mike
  generator: false

plugins:
  - search
  - minify:
      minify_html: true
  - macros:
      include_dir: docs/include

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - First Test: getting-started/first-test.md
  - Architecture:
    - Overview: architecture/overview.md
    - Strategy Pattern: architecture/strategy-pattern.md
    - Driver Architecture: architecture/drivers.md
    - Locator System: architecture/locators.md
    - Data Flow: architecture/data-flow.md
  - User Guides:
    - For QA Engineers: guides/qa-engineers.md
    - For Developers: guides/developers.md
    - For Managers: guides/managers.md
    - For DevOps: guides/devops.md
  - API Reference:
    - Core Interfaces: api/core-interfaces.md
    - Driver API: api/driver-api.md
    - Locator API: api/locator-api.md
    - Database API: api/database-api.md
    - Configuration: api/configuration.md
  - Best Practices:
    - Test Design: best-practices/test-design.md
    - Locator Strategy: best-practices/locators.md
    - Error Handling: best-practices/error-handling.md
    - CI/CD Integration: best-practices/cicd.md
    - Performance: best-practices/performance.md
  - Troubleshooting:
    - Common Issues: troubleshooting/common-issues.md
    - Debugging: troubleshooting/debugging.md
    - FAQ: troubleshooting/faq.md
  - Contributing:
    - Guidelines: contributing/guidelines.md
    - Code Style: contributing/code-style.md
    - Pull Requests: contributing/pull-requests.md
  - Changelog: changelog.md