# Mobile-specific Locators
# Appium-compatible selectors for Android/iOS

# Login Screen
mobile.login.username.field=//android.widget.EditText[@resource-id='username']
mobile.login.password.field=//android.widget.EditText[@resource-id='password']
mobile.login.submit.button=//android.widget.Button[@text='Login']
mobile.login.forgot.password=//android.widget.TextView[@text='Forgot Password?']

# iOS alternative selectors (using accessibility IDs)
ios.login.username.field=username_field
ios.login.password.field=password_field
ios.login.submit.button=login_button

# Dashboard Screen
mobile.dashboard.welcome.text=//android.widget.TextView[@resource-id='welcome_text']
mobile.dashboard.menu.button=//android.widget.ImageButton[@content-desc='Menu']
mobile.dashboard.profile.icon=//android.widget.ImageView[@resource-id='profile_icon']
mobile.dashboard.logout.button=//android.widget.TextView[@text='Logout']

# Navigation
mobile.nav.home=//android.widget.BottomNavigationView//android.view.View[@content-desc='Home']
mobile.nav.profile=//android.widget.BottomNavigationView//android.view.View[@content-desc='Profile']
mobile.nav.settings=//android.widget.BottomNavigationView//android.view.View[@content-desc='Settings']