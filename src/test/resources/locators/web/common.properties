# Web-specific Common Locators
# Playwright-compatible selectors

# Page URLs
login.page.url=https://staging.example.com/login
dashboard.page.url=https://staging.example.com/dashboard
home.page.url=https://staging.example.com

# Login Page
login.username.field=#username
login.password.field=#password
login.submit.button=button[type='submit']
login.remember.checkbox=#remember-me
login.forgot.password.link=a[href*='forgot-password']
login.error.message=.login-error

# Dashboard Page
dashboard.header=h1.dashboard-title
dashboard.welcome.message=.welcome-message
dashboard.user.menu=.user-menu
dashboard.notifications.badge=.notification-badge
dashboard.logout.button=button.logout-btn