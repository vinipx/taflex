# API Endpoints
# Base URL configured in automation.properties

# User Endpoints
users.endpoint=/api/v1/users
user.get.endpoint=/api/v1/users/{id}
user.create.endpoint=/api/v1/users
user.update.endpoint=/api/v1/users/{id}
user.delete.endpoint=/api/v1/users/{id}

# Authentication Endpoints
auth.login.endpoint=/api/v1/auth/login
auth.logout.endpoint=/api/v1/auth/logout
auth.refresh.endpoint=/api/v1/auth/refresh
auth.verify.endpoint=/api/v1/auth/verify

# Order Endpoints
orders.endpoint=/api/v1/orders
order.get.endpoint=/api/v1/orders/{id}
order.create.endpoint=/api/v1/orders
order.update.endpoint=/api/v1/orders/{id}
order.cancel.endpoint=/api/v1/orders/{id}/cancel

# Product Endpoints
products.endpoint=/api/v1/products
product.get.endpoint=/api/v1/products/{id}
product.search.endpoint=/api/v1/products/search

# Health Check
health.endpoint=/health
info.endpoint=/info