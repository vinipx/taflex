plugins {
    id 'java'
    id 'idea'
    id 'checkstyle'
    id 'pmd'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'io.github.vinipx'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

allure {
    version = '2.24.0'
    useTestNG {
        version = '2.24.0'
    }
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootProject.projectDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = true
    maxWarnings = 100
}

pmd {
    toolVersion = '7.0.0'
    ruleSetFiles = files("${rootProject.projectDir}/config/pmd/pmd-ruleset.xml")
    ignoreFailures = true
    consoleOutput = true
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

ext {
    testngVersion = '7.8.0'
    playwrightVersion = '1.41.0'
    appiumVersion = '9.0.0'
    httpClientVersion = '4.5.14'
    hikariCpVersion = '5.1.0'
    reportPortalVersion = '5.3.1'
    slf4jVersion = '2.0.9'
    logbackVersion = '1.4.14'
    jacksonVersion = '2.16.0'
    assertjVersion = '3.24.2'
    commonsIoVersion = '2.15.1'
    commonsCsvVersion = '1.10.0'
    grpcVersion = '1.60.0'
}

dependencies {
    // TestNG - test scope only
    testImplementation "org.testng:testng:$testngVersion"
    testImplementation "io.cucumber:cucumber-java:7.15.0"
    testImplementation "io.cucumber:cucumber-testng:7.15.0"
    
    // Microsoft Playwright
    implementation "com.microsoft.playwright:playwright:$playwrightVersion"
    
    // Appium
    implementation "io.appium:java-client:$appiumVersion"
    
    // Apache HttpClient
    implementation "org.apache.httpcomponents:httpclient:$httpClientVersion"
    
    // JDBC Connection Pooling
    implementation "com.zaxxer:HikariCP:$hikariCpVersion"
    
    // Report Portal - test scope only
    testImplementation "com.epam.reportportal:agent-java-testng:$reportPortalVersion"
    testImplementation 'com.epam.reportportal:logger-java-logback:5.1.6'
    
    // JSON Processing
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:$jacksonVersion"
    
    // Logging
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "ch.qos.logback:logback-classic:$logbackVersion"
    
    // Assertions - test scope only
    testImplementation "org.assertj:assertj-core:$assertjVersion"
    testImplementation "org.mockito:mockito-core:5.8.0"
    
    // Utilities
    implementation "commons-io:commons-io:$commonsIoVersion"
    implementation "org.apache.commons:commons-csv:$commonsCsvVersion"
    implementation "au.com.dius.pact:consumer:4.6.3"
    implementation "org.apache.httpcomponents.client5:httpclient5:5.3"
    
    // Database Drivers
    runtimeOnly 'org.postgresql:postgresql:42.7.1'
    runtimeOnly 'com.mysql:mysql-connector-j:8.2.0'
    
    // gRPC (Optional)
    implementation "io.grpc:grpc-netty-shaded:$grpcVersion"
    implementation "io.grpc:grpc-protobuf:$grpcVersion"
    implementation "io.grpc:grpc-stub:$grpcVersion"
}

tasks.register('installPlaywright', JavaExec) {
    group = 'setup'
    description = 'Install Playwright browsers'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install'
}

// Build verification task - compiles code and runs static analysis without running tests
tasks.register('verifyBuild') {
    group = 'build'
    description = 'Verify build by compiling sources and running static analysis'
    dependsOn classes
    dependsOn testClasses
    dependsOn checkstyleMain
    dependsOn checkstyleTest
    dependsOn pmdMain
    dependsOn pmdTest
}

// CI build task - runs compilation verification only
tasks.register('ciBuild') {
    group = 'build'
    description = 'CI build - compile sources without running browser tests'
    dependsOn verifyBuild
}

tasks.register('runMcp', JavaExec) {
    group = 'mcp'
    description = 'Start the TAFLEX MCP Server'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'io.github.vinipx.taflex.mcp.TaflexMcpServer'
    standardInput = System.in
}

tasks.register('webTest', Test) {
    group = 'verification'
    description = 'Run Web tests'
    systemProperty 'suite', 'web-suite'
}

tasks.register('apiTest', Test) {
    group = 'verification'
    description = 'Run API tests'
    systemProperty 'suite', 'api-suite'
}

tasks.register('mobileTest', Test) {
    group = 'verification'
    description = 'Run Mobile tests'
    systemProperty 'suite', 'mobile-suite'
}

tasks.register('smokeTest', Test) {
    group = 'verification'
    description = 'Run Smoke tests'
    systemProperty 'suite', 'smoke-suite'
}

tasks.register('regressionTest', Test) {
    group = 'verification'
    description = 'Run Regression tests'
    systemProperty 'suite', 'regression-suite'
}

compileTestJava {
}

sourceSets {
    unitTest {
        java {
            srcDirs = ['src/test/java/io/github/vinipx/taflex/tests/unit']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
    }
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

configurations {
    unitTestImplementation.extendsFrom testImplementation
    unitTestRuntimeOnly.extendsFrom testRuntimeOnly
}

test {
    useTestNG()
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath = sourceSets.unitTest.runtimeClasspath
    
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    
    reports {
        html.outputLocation = file("$buildDir/reports/tests")
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}