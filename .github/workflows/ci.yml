name: CI - Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-verification:
    name: Setup Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Verify Java Version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Make scripts executable
        run: chmod +x setup.sh gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Create automation.properties
        run: cp automation.properties.template automation.properties

      - name: Ensure required directories
        run: |
          mkdir -p logs screenshots test-output
          test -f automation.properties && echo "✓ automation.properties created"
          test -d logs && echo "✓ logs directory created"
          test -d screenshots && echo "✓ screenshots directory created"

  lint:
    name: Code Hygiene (Lint)
    runs-on: ubuntu-latest
    needs: setup-verification
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Run Checkstyle and PMD
        run: ./gradlew checkstyleMain checkstyleTest pmdMain pmdTest --no-daemon

      - name: Upload Lint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: build/reports/

  compile-main:
    name: Compile Main Sources
    runs-on: ubuntu-latest
    needs: setup-verification
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Compile main sources
        run: ./gradlew compileJava --no-daemon

      - name: Upload compilation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-compilation-reports
          path: build/reports/problems/

  compile-tests:
    name: Compile Test Sources
    runs-on: ubuntu-latest
    needs: compile-main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Create automation.properties from template
        run: cp automation.properties.template automation.properties

      - name: Compile test sources
        run: ./gradlew compileTestJava --no-daemon

      - name: Upload compilation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-compilation-reports
          path: build/reports/problems/

  full-build:
    name: Full Build
    runs-on: ubuntu-latest
    needs: [compile-main, compile-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Create automation.properties
        run: cp automation.properties.template automation.properties

      - name: Build project (compile and assemble)
        run: ./gradlew build -x test --no-daemon

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/
            build/classes/
          retention-days: 7

  status-summary:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs: [setup-verification, lint, compile-main, compile-tests, full-build]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Build Status Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setup Verification | ${{ needs.setup-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Hygiene (Lint) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compile Main | ${{ needs.compile-main.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compile Tests | ${{ needs.compile-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Full Build | ${{ needs.full-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "failure" ]; then
            echo "❌ **Some jobs failed. Please check the logs above.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          fi