name: PR - Code Review and Validation

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | wc -l)
          echo "Changed files: $CHANGED_FILES"
          
          ADDED_LINES=$(git diff --stat ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | tail -1 | awk '{print $4}')
          echo "Added lines: $ADDED_LINES"
          
          if [ "$CHANGED_FILES" -gt 50 ]; then
            echo "⚠️ Warning: This PR changes $CHANGED_FILES files. Consider breaking it into smaller PRs."
          fi
          
          if [ "$ADDED_LINES" -gt 1000 ]; then
            echo "⚠️ Warning: This PR adds $ADDED_LINES lines. Large PRs are harder to review."
          fi

  commit-message-validation:
    name: Commit Message Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          COMMITS=$(git log --format=%s ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          echo "Checking commit messages..."
          
          if echo "$COMMITS" | grep -vE "^(feat|fix|docs|style|refactor|test|chore|ci|build)(\(.+\))?: .+"; then
            echo "⚠️ Warning: Some commits don't follow conventional commit format"
            echo "Expected format: type(scope): description"
            echo "Types: feat, fix, docs, style, refactor, test, chore, ci, build"
          else
            echo "✓ All commits follow conventional format"
          fi

  build:
    name: Build (Ubuntu, JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Create automation.properties
        run: cp automation.properties.template automation.properties

      - name: Compile main sources
        run: ./gradlew compileJava --no-daemon

      - name: Compile test sources
        run: ./gradlew compileTestJava --no-daemon

      - name: Run Code Hygiene (Lint)
        run: ./gradlew checkstyleMain checkstyleTest pmdMain pmdTest --no-daemon

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [pr-size-check, commit-message-validation, build]
    if: always()
    steps:
      - name: PR Summary
        run: |
          echo "## Pull Request Validation Summary :mag:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PR Size | ${{ needs.pr-size-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit Messages | ${{ needs.commit-message-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ **This PR builds successfully.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **This PR has build failures. Please fix them before merging.**" >> $GITHUB_STEP_SUMMARY
          fi